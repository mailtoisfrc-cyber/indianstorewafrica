<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Store | Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* Deep Navy */
            background-image: 
                radial-gradient(at 0% 0%, hsla(28,100%,74%,0.15) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(187,100%,74%,0.05) 0, transparent 50%);
        }
        .saffron-glow {
            text-shadow: 0 0 20px rgba(255, 153, 51, 0.4);
        }
        .border-animation {
            border: 1px solid rgba(255, 153, 51, 0.3);
            transition: all 0.5s ease;
        }
        .border-animation:hover {
            border: 1px solid rgba(255, 153, 51, 0.8);
            box-shadow: 0 0 30px rgba(255, 153, 51, 0.1);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-6">

    <main class="text-center max-w-3xl border-animation rounded-3xl p-12 md:p-24 bg-slate-900/50 backdrop-blur-xl">
        
        <div class="mb-8 flex justify-center">
            <div class="text-[#FF9933] text-6xl opacity-80">
                <i class="fas fa-globe-africa"></i>
            </div>
        </div>

        <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter uppercase saffron-glow">
            Indian <br class="md:hidden"> <span class="text-[#FF9933]">Store</span>
        </h1>

        <div class="h-1 w-24 bg-[#FF9933] mx-auto mb-8 rounded-full"></div>

        <p class="text-2xl md:text-3xl font-light text-slate-300 mb-4">
            Coming Soon to Africa
        </p>
        
        <p class="text-lg text-slate-500 italic">
            "Bridging the Best of Both Worlds"
        </p>

    </main>

    <footer class="mt-12">
        <div class="flex space-x-8 text-slate-400 text-xl">
            <a href="#" class="hover:text-[#FF9933] transition-colors"><i class="fab fa-instagram"></i></a>
            <a href="#" class="hover:text-[#FF9933] transition-colors"><i class="fab fa-facebook"></i></a>
            <a href="#" class="hover:text-[#FF9933] transition-colors"><i class="fab fa-whatsapp"></i></a>
        </div>
    </footer>

</body>
</html>
